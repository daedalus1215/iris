name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the dev build release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test core
        shell: bash # with pipefail, so a failure isn't hidden by tee
        run: ./gradlew -p core test 2>&1 | tee core-test.log

      - name: Build APKs
        shell: bash
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebug 2>&1 | tee apk-build.log

      # Failed tests and compile errors as annotations, readable on the run page without signing in.
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("core/build/test-results/test/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      text = problem.get("message") or problem.text or ""
                      detail = " | ".join(line.strip() for line in text.splitlines()[:6])
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {detail}")
          EOF
          # GitHub keeps 10 annotations per step, so skip Gradle's task progress lines.
          cat core-test.log apk-build.log 2>/dev/null | grep -E '^(e: |ERROR:|> )' | grep -v '^> Task ' \
            | sed 's/%/%25/g; s/^/::error::/' || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: iris-apks
          path: android/app/build/outputs/apk/*/debug/*.apk

      # One rolling pre-release, so the phone can always install the newest build from the same page.
      - name: Publish the dev build release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk iris-dev.apk
          cp app/build/outputs/apk/prod/debug/app-prod-debug.apk iris-prod.apk
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev iris-dev.apk iris-prod.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android dev build" \
            --notes "Built from \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7}. On the phone, tap an APK to download and install it. Iris Dev and Iris can be installed side by side."
