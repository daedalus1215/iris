# Pass WebSocket upgrades (the touchpad) through to the backend; plain requests are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Looking the backend up per request (via the variable below)
    # means nginx still starts when the backend isn't up yet, instead of refusing to boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API, for when this container is reached on its own published port (phones that
    # can't resolve .lan names). Through Traefik, /api goes straight to the backend and
    # never reaches this block. `iris-backend` is the backend's alias on the edge network.
    location /api/ {
        set $iris_backend http://iris-backend:8080;
        proxy_pass $iris_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The backend pings open touchpad sockets every 20 s, so an idle one stays within this.
        proxy_read_timeout 30s;
    }

    # Hash routing means every page is index.html; this also covers a stray deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be fresh, or a deploy keeps loading the old asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built assets carry content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
